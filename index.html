<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Club Membership Checker</title>
    <!-- Bootstrap 5 CSS for clean, user-friendly design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- PyScript CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">ICT Club Portal</h2>
                        <p class="text-muted">Enter your name to check your membership status</p>
                    </div>

                    <!-- Input Fields -->
                    <div class="mb-3">
                        <label for="first-name" class="form-label fw-semibold">First Name</label>
                        <input type="text" id="first-name" class="form-control" placeholder="Enter first name">
                    </div>

                    <div class="mb-3">
                        <label for="last-name" class="form-label fw-semibold">Last Name</label>
                        <input type="text" id="last-name" class="form-control" placeholder="Enter last name">
                    </div>

                    <!-- Button -->
                    <div class="d-grid mt-4">
                        <button py-click="check_membership" class="btn btn-primary btn-lg">Check Status</button>
                    </div>

                    <!-- Result Area -->
                    <div class="mt-4">
                        <div id="result" class="p-3 text-center rounded fw-medium"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Link to external Python file -->
    <script type="py" src="./main.py"></script>

</body>
</html> #67
